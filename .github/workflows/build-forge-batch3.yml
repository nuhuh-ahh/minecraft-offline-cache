name: Build Forge Batch 3 Caches

on:
  workflow_dispatch:
  push:
    paths:
      - 'templates/forge-1.21.11/**'
      - 'templates/forge-26.1/**'
      - 'templates/forge-26.1.1/**'
      - 'templates/forge-26.1.2/**'
      - 'templates/forge-26.2/**'
      - 'templates/forge-26.3/**'
      - '.github/workflows/build-forge-batch3.yml'

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - version: '1.21.11'
            java: '21'
          - version: '26.1'
            java: '25'
          - version: '26.1.1'
            java: '25'
          - version: '26.1.2'
            java: '25'
          - version: '26.2'
            java: '25'
          - version: '26.3'
            java: '25'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (oracle)
        if: matrix.java == '25'
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Set up JDK 21 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x templates/forge-${{ matrix.version }}/gradlew

      - name: Build Forge ${{ matrix.version }} and Cache All Dependencies
        working-directory: templates/forge-${{ matrix.version }}
        run: ./gradlew build --no-daemon -Porg.gradle.java.installations.paths="${JAVA_HOME_25_X64:-$JAVA_HOME}"

      - name: Verify Offline Build on Linux x64
        working-directory: templates/forge-${{ matrix.version }}
        run: ./gradlew clean build --offline --stacktrace --no-daemon -Porg.gradle.java.installations.paths="${JAVA_HOME_25_X64:-$JAVA_HOME}"

      - name: Package Linux Cache into <=94MB Chunks and All-in-One Zip
        run: |
          python3 .github/scripts/package_release.py \
            --loader Forge \
            --mc-version ${{ matrix.version }} \
            --java-version ${{ matrix.java }} \
            --project-dir templates/forge-${{ matrix.version }} \
            --dist-dir dist

      - name: Create or Update GitHub Release with Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v${{ matrix.version }}-forge dist/* \
            --title "Forge ${{ matrix.version }} Linux x64 Offline Cache" \
            --notes "Pre-cached Forge ${{ matrix.version }} with JDK ${{ matrix.java }} Linux x64 in <=94MB zip chunks for Gemini Web." \
            || gh release upload v${{ matrix.version }}-forge dist/* --clobber
