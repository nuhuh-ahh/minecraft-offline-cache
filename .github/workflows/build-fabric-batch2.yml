name: Build Fabric Batch 2 Caches

on:
  workflow_dispatch:
  push:
    paths:
      - 'templates/fabric-1.14/**'
      - 'templates/fabric-1.14.3/**'
      - 'templates/fabric-1.15.1/**'
      - 'templates/fabric-1.16.1/**'
      - 'templates/fabric-1.16.3/**'
      - 'templates/fabric-1.16.4/**'
      - 'templates/fabric-1.17/**'
      - 'templates/fabric-1.18/**'
      - 'templates/fabric-1.18.1/**'
      - 'templates/fabric-1.19/**'
      - 'templates/fabric-1.19.1/**'
      - 'templates/fabric-1.19.3/**'
      - 'templates/fabric-1.19.4/**'
      - 'templates/fabric-1.20/**'
      - 'templates/fabric-1.20.2/**'
      - 'templates/fabric-1.20.3/**'
      - '.github/workflows/build-fabric-batch2.yml'

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - version: '1.14'
            java: '8'
          - version: '1.14.3'
            java: '8'
          - version: '1.15.1'
            java: '8'
          - version: '1.16.1'
            java: '8'
          - version: '1.16.3'
            java: '8'
          - version: '1.16.4'
            java: '8'
          - version: '1.17'
            java: '16'
          - version: '1.18'
            java: '17'
          - version: '1.18.1'
            java: '17'
          - version: '1.19'
            java: '17'
          - version: '1.19.1'
            java: '17'
          - version: '1.19.3'
            java: '17'
          - version: '1.19.4'
            java: '17'
          - version: '1.20'
            java: '17'
          - version: '1.20.2'
            java: '17'
          - version: '1.20.3'
            java: '17'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Set up JDK 16 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x templates/fabric-${{ matrix.version }}/gradlew

      - name: Build Fabric ${{ matrix.version }} and Cache All Dependencies
        working-directory: templates/fabric-${{ matrix.version }}
        run: ./gradlew build --no-daemon

      - name: Verify Offline Build on Linux x64
        working-directory: templates/fabric-${{ matrix.version }}
        run: ./gradlew build --offline --stacktrace --no-daemon

      - name: Package Linux Cache into <=94MB Chunks and All-in-One Zip
        run: |
          python3 .github/scripts/package_release.py \
            --loader Fabric \
            --mc-version ${{ matrix.version }} \
            --java-version ${{ matrix.java }} \
            --project-dir templates/fabric-${{ matrix.version }} \
            --dist-dir dist

      - name: Create or Update GitHub Release with Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v${{ matrix.version }}-fabric dist/* \
            --title "Fabric ${{ matrix.version }} Linux x64 Offline Cache" \
            --notes "Pre-cached Fabric ${{ matrix.version }} with Temurin JDK ${{ matrix.java }} Linux x64 in <=94MB zip chunks for Gemini Web." \
            || gh release upload v${{ matrix.version }}-fabric dist/* --clobber
