name: Build Forge Batch 2 Caches

on:
  workflow_dispatch:
  push:
    paths:
      - 'templates/forge-1.14.4/**'
      - 'templates/forge-1.15.2/**'
      - 'templates/forge-1.17.1/**'
      - 'templates/forge-1.19.2/**'
      - 'templates/forge-1.19.4/**'
      - 'templates/forge-1.20.4/**'
      - 'templates/forge-1.20.6/**'
      - 'templates/forge-1.21/**'
      - 'templates/forge-1.21.1/**'
      - '.github/workflows/build-forge-batch2.yml'

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - version: '1.14.4'
            java: '8'
          - version: '1.15.2'
            java: '8'
          - version: '1.17.1'
            java: '16'
          - version: '1.19.2'
            java: '17'
          - version: '1.19.4'
            java: '17'
          - version: '1.20.4'
            java: '17'
          - version: '1.20.6'
            java: '21'
          - version: '1.21'
            java: '21'
          - version: '1.21.1'
            java: '21'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }} (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Grant execute permission for gradlew
        run: chmod +x templates/forge-${{ matrix.version }}/gradlew

      - name: Build Forge ${{ matrix.version }} and Cache All Dependencies
        working-directory: templates/forge-${{ matrix.version }}
        run: ./gradlew build --no-daemon

      - name: Verify Offline Build on Linux x64
        working-directory: templates/forge-${{ matrix.version }}
        run: ./gradlew clean build --offline --stacktrace --no-daemon

      - name: Package Linux Cache into <=94MB Chunks and All-in-One Zip
        run: |
          python3 .github/scripts/package_release.py \
            --loader Forge \
            --mc-version ${{ matrix.version }} \
            --java-version ${{ matrix.java }} \
            --project-dir templates/forge-${{ matrix.version }} \
            --dist-dir dist

      - name: Create or Update GitHub Release with Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v${{ matrix.version }}-forge dist/* \
            --title "Forge ${{ matrix.version }} Linux x64 Offline Cache" \
            --notes "Pre-cached Forge ${{ matrix.version }} with Temurin JDK ${{ matrix.java }} Linux x64 in <=94MB zip chunks for Gemini Web." \
            || gh release upload v${{ matrix.version }}-forge dist/* --clobber
