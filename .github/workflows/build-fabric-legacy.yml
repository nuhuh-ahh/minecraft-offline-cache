name: Build Fabric Legacy Caches

on:
  workflow_dispatch:
  push:
    paths:
      - 'templates/fabric-1.9.4/**'
      - 'templates/fabric-1.10.2/**'
      - 'templates/fabric-1.11.2/**'
      - 'templates/fabric-1.12.2/**'
      - 'templates/fabric-1.13.2/**'
      - '.github/workflows/build-fabric-legacy.yml'
      - '.github/scripts/package_release.py'

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        version: ['1.9.4', '1.10.2', '1.11.2', '1.12.2', '1.13.2']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x templates/fabric-${{ matrix.version }}/gradlew

      - name: Build Fabric ${{ matrix.version }} and Cache All Dependencies
        working-directory: templates/fabric-${{ matrix.version }}
        run: ./gradlew build --no-daemon

      - name: Verify Offline Build on Linux x64
        working-directory: templates/fabric-${{ matrix.version }}
        run: ./gradlew clean build --offline --stacktrace --no-daemon

      - name: Package Linux Cache into <=94MB Chunks and All-in-One Zip
        run: |
          python3 .github/scripts/package_release.py \
            --loader Fabric \
            --mc-version ${{ matrix.version }} \
            --java-version 8 \
            --project-dir templates/fabric-${{ matrix.version }} \
            --dist-dir dist

      - name: Create or Update GitHub Release with Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v${{ matrix.version }}-fabric dist/* \
            --title "Fabric ${{ matrix.version }} Linux x64 Offline Cache" \
            --notes "Pre-cached Legacy Fabric ${{ matrix.version }} with Temurin JDK 8 Linux x64 in <=94MB zip chunks for Gemini Web." \
            || gh release upload v${{ matrix.version }}-fabric dist/* --clobber
