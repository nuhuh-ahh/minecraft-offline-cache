name: Build Fabric Modern Caches

on:
  workflow_dispatch:
  push:
    paths:
      - 'templates/fabric-1.14.4/**'
      - 'templates/fabric-1.15.2/**'
      - 'templates/fabric-1.16.5/**'
      - 'templates/fabric-1.17.1/**'
      - 'templates/fabric-1.18.2/**'
      - 'templates/fabric-1.19.2/**'
      - 'templates/fabric-1.20.1/**'
      - 'templates/fabric-1.20.4/**'
      - 'templates/fabric-1.21.1/**'
      - '.github/workflows/build-fabric-modern.yml'
      - '.github/scripts/package_release.py'

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - version: '1.14.4'
            java: '8'
          - version: '1.15.2'
            java: '8'
          - version: '1.16.5'
            java: '8'
          - version: '1.17.1'
            java: '16'
          - version: '1.18.2'
            java: '17'
          - version: '1.19.2'
            java: '17'
          - version: '1.20.1'
            java: '17'
          - version: '1.20.4'
            java: '17'
          - version: '1.21.1'
            java: '21'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x templates/fabric-${{ matrix.version }}/gradlew

      - name: Build Fabric ${{ matrix.version }} and Cache All Dependencies
        working-directory: templates/fabric-${{ matrix.version }}
        run: ./gradlew build --no-daemon

      - name: Verify Offline Build on Linux x64
        working-directory: templates/fabric-${{ matrix.version }}
        run: ./gradlew clean build --offline --stacktrace --no-daemon

      - name: Package Linux Cache into <=94MB Chunks and All-in-One Zip
        run: |
          python3 .github/scripts/package_release.py \
            --loader Fabric \
            --mc-version ${{ matrix.version }} \
            --java-version ${{ matrix.java }} \
            --project-dir templates/fabric-${{ matrix.version }} \
            --dist-dir dist

      - name: Create or Update GitHub Release with Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v${{ matrix.version }}-fabric dist/* \
            --title "Fabric ${{ matrix.version }} Linux x64 Offline Cache" \
            --notes "Pre-cached Fabric ${{ matrix.version }} with Temurin JDK ${{ matrix.java }} Linux x64 in <=94MB zip chunks for Gemini Web." \
            || gh release upload v${{ matrix.version }}-fabric dist/* --clobber
