name: Build Forge 1.8.9 Cache

on:
  workflow_dispatch:
  push:
    paths:
      - 'templates/forge-1.8.9/**'
      - '.github/workflows/build-forge.yml'

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x templates/forge-1.8.9/gradlew

      - name: Build Forge 1.8.9 and Cache All Dependencies
        working-directory: templates/forge-1.8.9
        run: ./gradlew build --no-daemon

      - name: Verify Offline Build on Linux x64
        working-directory: templates/forge-1.8.9
        run: ./gradlew build --offline --stacktrace --no-daemon

      - name: Package Linux Cache into <=94MB Chunks and All-in-One Zip
        run: |
          python3 .github/scripts/package_release.py \
            --loader Forge \
            --mc-version 1.8.9 \
            --java-version 8 \
            --project-dir templates/forge-1.8.9 \
            --dist-dir dist

      - name: Create or Update GitHub Release with Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.8.9-forge dist/* \
            --title "Forge 1.8.9 Linux x64 Offline Cache" \
            --notes "Pre-cached Forge 1.8.9 with Temurin JDK 8 Linux x64 in <=94MB zip chunks for Gemini Web." \
            || gh release upload v1.8.9-forge dist/* --clobber
