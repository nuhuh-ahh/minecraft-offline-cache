buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://repo.essential.gg/repository/maven-public/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/maven/' }
        maven { url = 'https://repo.sk1er.club/repository/maven-releases/' }
    }
    dependencies {
        classpath 'gg.essential:architectury-loom:0.10.0.5'
        classpath 'dev.architectury.architectury-pack200:dev.architectury.architectury-pack200.gradle.plugin:0.1.3'
    }
}

apply plugin: 'java'
apply plugin: 'gg.essential.loom'
apply plugin: 'dev.architectury.architectury-pack200'

base.archivesName = 'examplemod'
version = '1.0.0'
group = 'com.example.modid'

loom {
    forge {
        pack200Provider = new dev.architectury.pack200.java.Pack200Adapter()
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/maven/' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.essential.gg/repository/maven-public/' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.architectury.dev/' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.8.9"
    mappings "de.oceanlabs.mcp:mcp_stable:22-1.8.9"
    forge "net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
